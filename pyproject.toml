[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "data-quality-auditor"
version = "2.0.0"
description = "Automated Enterprise Data Quality Auditor with vectorized profiling, anomaly detection, MCAR/MAR pattern inference, and executable remediation generation."
authors = ["Automated Data Quality Auditor Team"]
readme = "README.md"
packages = [{include = "backend"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.115.0"
uvicorn = ">=0.30.0"
polars = ">=1.0.0"
pandas = ">=2.2.0"
pyarrow = ">=17.0.0"
scipy = ">=1.14.0"
pydantic = ">=2.8.0"
jinja2 = ">=3.1.0"
python-multipart = ">=0.0.9"
weasyprint = ">=62.0"
reportlab = ">=4.2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
httpx = ">=0.27.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
